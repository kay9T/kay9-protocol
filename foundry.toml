[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
via_ir = true
ffi = false
fs_permissions = [
    { access = "read", path = "./script/config" },
    { access = "read", path = "./out" },
    { access = "read-write", path = "./script/output" },
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2000

[profile.ci.invariant]
runs = 128
depth = 128

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "preserve"

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

[etherscan]
robinhood = { key = "${BLOCKSCOUT_API_KEY}", chain = 4663, url = "https://robinhoodchain.blockscout.com/api/" }
